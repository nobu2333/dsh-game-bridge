[project]
name = "dsh-game-core"
version = "0.0.1"
description = "Local capture + OCR engine for the dsh-game-bridge plugin: gives a DSH agent real game eyes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nobu2333" }]
dependencies = [
  "numpy>=1.26",
  "dxcam>=0.3.0",
  "rapidocr-onnxruntime>=1.2.3",
]

[project.scripts]
dsh-game-core = "dsh_game_core.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dsh_game_core*"]

[tool.setuptools]
license-files = ["LICENSE"]
